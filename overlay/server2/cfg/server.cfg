// 30틱 서버 전용 server.cfg
// overlay/common/cfg/server.cfg 를 대체한다. common 쪽을 고치면 여기도 같이 고칠 것.
fps_max 300
sv_allow_lobby_connect_only 0
sv_consistency 0
sv_pure_kick_clients 0
sv_forcepreload 1

// l4dtoolz
sv_steam_bypass 1

// 서버 설정
exec listenserver.cfg

// 30틱 덮어쓰기 (listenserver.cfg 의 100틱 값 대체)
sm_cvar sv_minrate 30000
sm_cvar sv_maxrate 30000
sm_cvar sv_mincmdrate 30
sm_cvar sv_maxcmdrate 30
sm_cvar sv_minupdaterate 30
sm_cvar sv_maxupdaterate 30
sm_cvar net_splitrate 2
sm_cvar net_splitpacket_maxrate 15000
sm_cvar sv_clockcorrection_msecs 60
