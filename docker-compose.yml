# 1. 서버 실행/종료
#   docker compose up -d                 # 서버 2대 백그라운드 실행
#   docker compose up -d server1         # server1 하나만 실행
#   docker compose down                  # 전체 종료 (컨테이너 삭제)
#   docker compose stop server1          # server1 만 종료 (컨테이너 유지)
#
# 2. 변경 반영
#   docker compose up -d                 # 이 파일의 environment 변경 반영
#   docker compose up -d --force-recreate server1   # 컨테이너 강제 재생성
#   docker compose restart server1       # 프로세스만 재시작. 이미지/environment 변경은 반영 안 됨
#
# 3. 확인
#   docker compose ps                    # 상태 확인
#   docker compose logs -f server1       # 서버 로그 보기
#   docker compose attach server1        # 서버 콘솔 접속 (나가기: Ctrl+P, Ctrl+Q)

services:
  server1:
    container_name: l4d2-server1
    image: l4d2
    network_mode: host
    cpuset: "1" # srcds는 단일 스레드. 코어 0은 OS용으로 비워둠
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    volumes:
      - ./addons:/home/ubuntu/l4d2/left4dead2/addons
      - ./cfg/sourcemod:/home/ubuntu/l4d2/left4dead2/cfg/sourcemod
      - ./cfg/listenserver.cfg:/home/ubuntu/l4d2/left4dead2/cfg/listenserver.cfg
      - ./cfg/server.cfg:/home/ubuntu/l4d2/left4dead2/cfg/server.cfg
      - ./host.txt:/home/ubuntu/l4d2/left4dead2/host.txt
      - ./motd.txt:/home/ubuntu/l4d2/left4dead2/motd.txt
    environment:
      HOSTNAME: "Rainy Server #1"
      PORT: 30000
      STEAM_GROUP: 46571454
      STEAM_GROUP_EXCLUSIVE: 0
      DEFAULT_MAP: c1m2_streets
      DEFAULT_MODE: realism
      GAME_TYPES: coop,realism
      EXTRA_ARGS: "-insecure +sv_setmax 31"

  server2:
    container_name: l4d2-server2
    image: l4d2
    network_mode: host
    cpuset: "2"
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    volumes:
      - ./addons:/home/ubuntu/l4d2/left4dead2/addons
      - ./cfg/sourcemod:/home/ubuntu/l4d2/left4dead2/cfg/sourcemod
      - ./cfg/listenserver.cfg:/home/ubuntu/l4d2/left4dead2/cfg/listenserver.cfg
      - ./cfg/server.cfg:/home/ubuntu/l4d2/left4dead2/cfg/server.cfg
      - ./host.txt:/home/ubuntu/l4d2/left4dead2/host.txt
      - ./motd.txt:/home/ubuntu/l4d2/left4dead2/motd.txt
    environment:
      HOSTNAME: "Rainy Server #2"
      PORT: 30001
      STEAM_GROUP: 46571454
      STEAM_GROUP_EXCLUSIVE: 0
      DEFAULT_MAP: c1m2_streets
      DEFAULT_MODE: realism
      GAME_TYPES: coop,realism
      EXTRA_ARGS: "-insecure +sv_setmax 31"
