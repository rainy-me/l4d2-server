# 1. 서버 실행/종료
#   docker compose up -d                  # 전체 서버 백그라운드 실행
#   docker compose up -d server1          # server1 하나만 실행
#   docker compose down                   # 전체 종료 (컨테이너 삭제)
#   docker compose stop server1           # server1 만 종료 (컨테이너 유지)
#
# 2. 변경 반영
#   docker compose up -d                  # 이 파일의 environment 변경 반영
#   docker compose up -d --force-recreate # 컨테이너 강제 재생성
#   docker compose build                  # Dockerfile / entrypoint.sh 변경 후 이미지 다시 빌드
#   docker compose build --pull --no-cache # 캐시 없이 처음부터 다시 빌드
#   docker compose restart server1        # 프로세스만 재시작. 이미지/environment 변경은 반영 안 됨
#   ./sync.sh --restart server1           # server1 을 내리고 파일을 다시 동기화한 뒤 올림 (빌드는 내리기 전에 끝남)
#
# 3. 확인
#   docker compose ps                     # 상태 확인
#   docker compose logs -f server1        # 서버 로그 보기
#   docker compose attach server1         # 서버 콘솔 접속 (나가기: Ctrl+P, Ctrl+Q)

# 모든 서버 공통 설정. 서버마다 다른 것(cpuset, volumes, 일부 environment)만 services 에 적는다.
x-server: &server
  image: l4d2
  build: .
  network_mode: host
  restart: unless-stopped
  init: true
  stdin_open: true
  tty: true

x-environment: &environment
  STEAM_GROUP: ${STEAM_GROUP:-0}
  STEAM_GROUP_EXCLUSIVE: 0
  DEFAULT_MAP: c1m2_streets
  DEFAULT_MODE: realism
  GAME_TYPES: coop,realism

services:
  server1:
    <<: *server
    container_name: l4d2-server1
    cpuset: "1" # srcds는 단일 스레드. 코어 0은 OS용으로 비워둠
    volumes:
      - ./servers/server1/addons:/home/ubuntu/l4d2/left4dead2/addons
      - ./servers/server1/cfg/sourcemod:/home/ubuntu/l4d2/left4dead2/cfg/sourcemod
      - ./servers/server1/cfg/listenserver.cfg:/home/ubuntu/l4d2/left4dead2/cfg/listenserver.cfg
      - ./servers/server1/cfg/server.cfg:/home/ubuntu/l4d2/left4dead2/cfg/server.cfg
      - ./servers/server1/ems:/home/ubuntu/l4d2/left4dead2/ems
      - ./servers/server1/host.txt:/home/ubuntu/l4d2/left4dead2/host.txt
      - ./servers/server1/motd.txt:/home/ubuntu/l4d2/left4dead2/motd.txt
    environment:
      <<: *environment
      HOSTNAME: "Rainy Server"
      PORT: 30000
      EXTRA_ARGS: "-insecure -tickrate 100 +sv_setmax 31"

  server2:
    <<: *server
    container_name: l4d2-server2
    cpuset: "2"
    volumes:
      - ./servers/server2/addons:/home/ubuntu/l4d2/left4dead2/addons
      - ./servers/server2/cfg/sourcemod:/home/ubuntu/l4d2/left4dead2/cfg/sourcemod
      - ./servers/server2/cfg/listenserver.cfg:/home/ubuntu/l4d2/left4dead2/cfg/listenserver.cfg
      - ./servers/server2/cfg/server.cfg:/home/ubuntu/l4d2/left4dead2/cfg/server.cfg
      - ./servers/server2/ems:/home/ubuntu/l4d2/left4dead2/ems
      - ./servers/server2/host.txt:/home/ubuntu/l4d2/left4dead2/host.txt
      - ./servers/server2/motd.txt:/home/ubuntu/l4d2/left4dead2/motd.txt
    environment:
      <<: *environment
      HOSTNAME: "Rainy Server (30 tick)"
      PORT: 30001
      EXTRA_ARGS: "-insecure -tickrate 30 +sv_setmax 31"
